      function Featured(post) {
        return `
          <div class="grid lg:grid-cols-2 gap-12 items-center">
            <div class="relative aspect-[4/3] overflow-hidden rounded-lg"><img src="${post.content.imageUrl}"
                alt="Featured article: Featured Article Title — Hero Content Showcase - A professional image related to category"

                fetchpriority="high" width="592" height="444"></div>
            <div class="space-y-6">
              <h1 class="featured-title">${post.content.title}</h1>
              <div class="flex items-center space-x-4 text-sm"><span class="blog-meta">${post.content.author} /
                  WRITER</span><span class="text-muted-foreground" aria-hidden="true">—</span><span
                  class="blog-meta">CATEGORY</span><span class="text-muted-foreground"
                  aria-hidden="true">—</span><time class="blog-meta" datetime="2023-09-02">Date Format</time></div>
              <p class="text-lg text-muted-foreground leading-relaxed">Featured article description — This is where
                your main content excerpt would appear to give readers a preview of the full article.</p>
              <div class="pt-4"><a href="${post.url}"
                  aria-label="Read more about: Featured Article Title — Hero Content Showcase"
                  class="inline-flex items-center justify-center gap-2 whitespace-nowrap text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg]:size-4 [&amp;_svg]:shrink-0 border border-black bg-background hover:bg-black hover:text-white h-9 px-3">READ
                  MORE<span class="ml-2" aria-hidden="true">→</span></a></div>
            </div>
          </div>
        `;

      function AllPosts(posts) {
        return `
          ${posts.map(post => `
            <article data-klar-static class="blog-card group cursor-pointer transition-all duration-300 hover:shadow-lg border border-transparent hover:border-black">

              </a>

    <script>
      (function() {
        try {
          var d = document.documentElement,
            c = d.classList;
          var e = localStorage.getItem('theme');
          if (e === 'dark') {
            d.style.colorScheme = 'dark';
            c.remove('light');
            c.add('dark');
            // localStorage.setItem('theme', 'dark');
          } else {
            d.style.colorScheme = 'light';
            c.remove('dark');
            c.add('light');
            // localStorage.setItem('theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
